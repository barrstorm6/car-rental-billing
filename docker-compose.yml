name: car-rental-challenge
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rental_dev
      POSTGRES_PASSWORD: rental_dev
      POSTGRES_DB: rental_dev
    ports: ['127.0.0.1:5434:5432']
    volumes: ['development-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rental_dev -d rental_dev']
      interval: 2s
      timeout: 3s
      retries: 30
  db-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: rental_test
      POSTGRES_PASSWORD: rental_test
      POSTGRES_DB: rental_test
    ports: ['127.0.0.1:5435:5432']
    tmpfs: ['/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rental_test -d rental_test']
      interval: 2s
      timeout: 3s
      retries: 30
volumes:
  development-data:
